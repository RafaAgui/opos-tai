<div
  class="progress-bar"
  [class.progress-bar--primary]="variant() === 'primary'"
  [class.progress-bar--warning]="variant() === 'warning'"
  role="progressbar"
  [attr.aria-valuenow]="value()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="label() || ('Progreso: ' + value() + '%')"
>
  <div
    class="progress-bar__fill"
    [style.width.%]="value()"
  ></div>
</div>
